services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: omega_lines
      POSTGRES_USER: omega_lines
      POSTGRES_PASSWORD: omega_lines_password
    ports:
      - "5433:5432"
    volumes:
      - omega_lines_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omega_lines -d omega_lines"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  omega_lines_pgdata:
